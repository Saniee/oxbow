[workspace]
resolver = "3"
members = ["crates/engine", "crates/app"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"

# `cargo run` and `cargo test` build the dependencies (egui above all) optimised: an unoptimised egui is several
# times slower and stutters, which hides real performance problems. Oxbow's own crates stay quick to build.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
