<div id="progress" class="progress" role="progressbar" aria-label="Working"></div>
<div id="app">
  <div id="left" class="column"></div>
  <div id="sash-main" class="sash vertical" title="Drag to resize"></div>
  <div id="right" class="column">
    <section id="detail" class="panel detail">
      <header>
        <button id="back" class="text-button hidden" title="Back"><span class="codicon codicon-arrow-left"></span><span id="back-label">Back</span></button>
        <span id="detail-title" class="title"></span>
      </header>
      <div id="detail-body" class="body"></div>
    </section>
    <div id="sash-log" class="sash horizontal" title="Drag to resize"></div>
    <section id="log" class="panel log">
      <header>
        <span class="title">Command Log</span>
        <span class="spacer"></span>
        <button id="clear-log" class="icon-button codicon codicon-clear-all" title="Clear the Command Log"></button>
      </header>
      <div id="log-body" class="body"></div>
    </section>
  </div>
</div>
<div id="menu" class="menu hidden" role="menu"></div>
